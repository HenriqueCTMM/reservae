services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: reservae
      MYSQL_USER: reservae
      MYSQL_PASSWORD: reservae_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
